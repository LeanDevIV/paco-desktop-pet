<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        -webkit-app-region: no-drag;
      }

      /* 1. El marco (donde vive Paco) */
      #paco-container {
        width: 32px;
        height: 32px;
        overflow: hidden;
        position: relative;
        image-rendering: pixelated;
        transform: scale(4);
        border: 1px solid yellow;
        background-color: rgba(255, 0, 0, 0.2);
      }

      /* 2. La imagen adentro del marco */
      .sprite {
        width: 384px; /* Ancho total real de la imagen */
        height: 128px; /* Alto total real de la imagen */
        background-image: url("./assets/sprites.png");
        background-repeat: no-repeat;
        /* IMPORTANTE: Sacamos el background-size porcentual */
        background-size: auto;
        display: block;
      }
      /* La imagen del Sprite */
      .sprite {
        width: 100%;
        height: 100%;
        background-image: url("./assets/sprites.png");
        background-repeat: no-repeat;

        /* Asumiendo que el sprite sheet tiene 3 frames de ancho */
        background-size: 300% 400%; /* 3 columnas (300%), 4 filas (400%) */
      }

      /* Animación de Caminar */
      /* steps(3) significa que salta en 3 pasos, no desliza suave */
      .walk-anim {
        animation: walk-cycle 0.6s steps(3) infinite;
      }
      /* --- ANIMACIONES --- */

      /* Animación de Caminar (3 frames) */
      .walk-anim {
        animation: walk-cycle 0.5s steps(3) infinite;
      }

      @keyframes walk-cycle {
        /* Esto mueve la imagen de 0 a -96px (32*3) para mostrar los 3 frames de la animación */
        from {
          background-position-x: 0;
        }
        to {
          background-position-x: -96px;
        }
      }
      /* Efecto de comer: Vibración rápida */
      @keyframes munch {
        0% {
          transform: scale(3) translateY(0);
        }
        25% {
          transform: scale(3.2) translateY(-2px);
        }
        50% {
          transform: scale(3) translateY(0);
        }
        75% {
          transform: scale(3.2) translateY(-2px);
        }
        100% {
          transform: scale(3) translateY(0);
        }
      }

      .eating {
        animation: munch 0.2s ease-in-out infinite;
      } /* --- DIRECCIONES (Filas) --- */
      /* Cambiamos la posición Y para elegir qué fila ver */
      .facing-down {
        background-position-y: 0;
      }
      .facing-right {
        background-position-y: -32px;
      }
      .facing-left {
        background-position-y: -64px;
      }
      .facing-up {
        background-position-y: -96px;
      }
      .facing-down {
        background-position-y: 0px;
      }
      .facing-right {
        background-position-y: -32px;
      } /* Ajustar si tu frame mide distinto */
      .facing-left {
        background-position-y: -64px;
      }
      .facing-up {
        background-position-y: -96px;
      }
    </style>
  </head>
  <body>
    <div id="paco-container">
      <div id="paco-sprite" class="sprite facing-down"></div>
    </div>

    <script>
      const petBrain = require("./systems/PetBrain");
      document.addEventListener("DOMContentLoaded", () => {
        petBrain.init();
        const paco = document.getElementById("paco-container");
        paco.addEventListener("click", () => petBrain.interact());
      });
      const { ipcRenderer } = require("electron");
      ipcRenderer.on("error-report", (e, err) => console.error(err));
    </script>
  </body>
</html>
