<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        -webkit-app-region: no-drag;
      }

      /* 1. El marco (donde vive Paco) */
      #paco-container {
        /* Default size */
        width: 48px;
        height: 48px;
        overflow: hidden;
        position: relative;
        image-rendering: pixelated;
        transform: scale(3);
        background-color: transparent;
        transition:
          width 0.2s,
          height 0.2s; /* Smooth visual transition */
      }

      /* 2. La imagen adentro (El Sprite) */
      .sprite {
        width: 100%;
        height: 100%;
        background-repeat: no-repeat;
        display: block;
      }

      /* --- ESTADOS (Cambian la imagen y el tamaño) --- */

      /* WALKING / IDLE (Usa la hoja principal) */
      .state-walking,
      .state-idle {
        background-image: url("./assets/sprites.png");
        /* 3 columns = 300%, 4 rows = 400% based on 48x48 frame */
        background-size: 300% 400%;
      }

      /* EATING (Nueva hoja) */
      .state-eating {
        background-image: url("./assets/eat.png");
        /* Tira horizontal de 4 frames (4 * 100% width?) */
        /* Si el container es 48x48 y la imagen es 192x48 */
        /* background-size: 400% 100% (4 columnas, 1 fila) */
        background-size: 400% 100%;
        animation: eat-cycle 0.5s steps(4) infinite;
      }

      /* SLEEPING (Nueva hoja) */
      .state-sleeping {
        background-image: url("./assets/sleep.png");
        background-size: 100% 100%;
        width: 32px !important;
        height: 32px !important;
        /* Center in container if container is larger? Or rely on JS to resize container? */
        /* For now, force sprite size. Container might have empty space if not resized. */
        margin: 8px; /* Center 32px in 48px container roughly (48-32)/2 = 8 */
      }

      /* --- ANIMACIONES --- */

      /* Caminar */
      .state-walking {
        animation: walk-cycle 0.6s steps(3) infinite;
      }

      @keyframes walk-cycle {
        from {
          background-position-x: 0;
        }
        to {
          background-position-x: -144px;
        }
      }

      @keyframes eat-cycle {
        from {
          background-position-x: 0;
        }
        to {
          background-position-x: -192px;
        } /* 4 frames * 48px */
      }

      /* --- DIRECCIONES (Solo para Walking/Idle) --- */
      /* Altura de frame = 48px */
      .facing-down {
        background-position-y: 0px;
      }
      .facing-left {
        background-position-y: -48px;
      }
      .facing-right {
        background-position-y: -96px;
      }
      .facing-up {
        background-position-y: -144px;
      }
    </style>
  </head>
  <body>
    <div id="paco-container">
      <div id="paco-sprite" class="sprite facing-down"></div>
    </div>

    <script>
      const petBrain = require("./systems/PetBrain");
      document.addEventListener("DOMContentLoaded", () => {
        petBrain.init();
        const paco = document.getElementById("paco-container");
        paco.addEventListener("click", () => petBrain.interact());
      });
      const { ipcRenderer } = require("electron");
      ipcRenderer.on("error-report", (e, err) => console.error(err));
    </script>
  </body>
</html>
