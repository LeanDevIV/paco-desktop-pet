<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        -webkit-app-region: no-drag;
      }

      /* 1. El marco (donde vive Paco) */
      #paco-container {
        /* Default size */
        width: 48px;
        height: 48px;
        width: 48px;
        height: 48px;
        /* overflow: hidden; Removed to allow error bubble to pop out */
        position: relative;
        image-rendering: pixelated;
        transform: scale(3);
        background-color: transparent;
        transition:
          width 0.2s,
          height 0.2s; /* Smooth visual transition */
        border: 1px solid red; /* DEBUGGING */
      }

      /* 2. La imagen adentro (El Sprite) */
      .sprite {
        width: 100%;
        height: 100%;
        background-repeat: no-repeat;
        display: block;
      }

      /* --- ESTADOS (Cambian la imagen y el tamaño) --- */

      /* WALKING / IDLE (Usa la hoja principal) */
      .state-walking,
      .state-idle {
        background-image: url("./assets/sprites.png");
        /* 3 columns = 300%, 4 rows = 400% based on 48x48 frame */
        background-size: 300% 400%;
      }

      /* EATING (New Animation) */
      .state-eating {
        background-image: url("./assets/eating.png");
        /* Standard grid: 3 cols, 4 rows (like sprites.png) */
        background-size: 300% 400%;
        background-position-y: 0; /* Row 0 */

        /* Two animations: one for frames, one for vibration at the end */
        /* Duration 1.5s */
        animation:
          eat-sprite 1.5s steps(1) forwards,
          eat-vibrate 1.5s linear forwards;
      }

      /* SLEEPING (Nueva hoja) */
      .state-sleeping {
        background-image: url("./assets/sleep.png");
        /* Same grid as sprites.png: 3 cols, 4 rows */
        background-size: 300% 400%;
        /* Row 1 (Index 1) -> -48px */
        background-position-y: -48px;
        width: 48px !important;
        height: 48px !important;
        margin: 0; /* Align with container */
        animation: sleep-cycle 1s steps(2) infinite;
      }

      /* HELD (Single sprite) */
      .state-held {
        background-image: url("./assets/held.png");
        /* Adjusted focus: Scaling 222x256 sprite sheet to fit 48px height (Scale ~0.75) */
        /* Frame is ~74x64. Scaled to ~55.5x48. Centered X (-4px). */
        background-size: 167px 192px;
        width: 48px !important;
        height: 48px !important;
        margin: 0;
        background-position: -12px -10px;
        transition: transform 0.1s ease-out; /* Smooth physics sway */
        background-position: -12px -10px;
        transition: transform 0.1s ease-out; /* Smooth physics sway */
      }

      /* LOVE (Click Interaction) */
      .state-love {
        background-image: url("./assets/love.png");
        /* Scaling: 222px -> 178px (0.8x) to fit 60px sprite into 48px container */
        background-size: 178px 205px;
        background-position-y: 8px; /* Center vertically */
        /* Animation: Frame sequence 0-1-2-1-2 + Shake */
        animation:
          love-sequence 1.2s steps(1) infinite,
          eat-vibrate 1.2s linear infinite; /* Reuse eating shake */
      }

      /* --- ERROR BUBBLE --- */
      #error-bubble {
        position: absolute;
        bottom: 100%; /* Just above the sprite */
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        border: 1px solid #ff0000;
        color: #ff0000;
        padding: 2px 4px;
        border-radius: 4px;
        font-family: sans-serif;
        font-size: 6px; /* Small because of 3x scale */
        white-space: nowrap;
        z-index: 999;
        display: none; /* Hidden by default */
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        flex-direction: row;
        align-items: center;
        gap: 2px;
      }

      #error-bubble.visible {
        display: flex;
        animation: pop-in 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      #close-error {
        cursor: pointer;
        font-weight: bold;
        color: #333;
        margin-left: 2px;
        font-size: 8px;
        line-height: 1;
      }

      #close-error:hover {
        color: red;
      }

      /* Tail of the bubble */
      #error-bubble::after {
        content: "";
        position: absolute;
        bottom: -3px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 3px 3px 0;
        border-style: solid;
        border-color: #ff0000 transparent transparent transparent;
      }
      #error-bubble::before {
        content: "";
        position: absolute;
        bottom: -2px; /* overlap border */
        left: 50%;
        transform: translateX(-50%);
        border-width: 3px 3px 0;
        border-style: solid;
        border-color: #fff transparent transparent transparent;
        z-index: 1;
      }

      @keyframes pop-in {
        from {
          transform: translateX(-50%) scale(0);
          opacity: 0;
        }
        to {
          transform: translateX(-50%) scale(1);
          opacity: 1;
        }
      }

      /* --- THOUGHT BUBBLE (Hunger) --- */
      #thought-bubble {
        position: absolute;
        bottom: 32px; /* Position relative to 48px container */
        right: 0px;
        background: #fff;
        border: 1px solid #333; /* Thinner border */
        border-radius: 50%;
        padding: 2px;
        min-width: 12px; /* Small size */
        min-height: 12px;
        display: none; /* Hidden by default */
        justify-content: center;
        align-items: center;
        font-size: 8px; /* Small text */
        z-index: 998;
        box-shadow: 1px 1px 0px rgba(0, 0, 0, 0.2);
        animation: float-bubble 2s ease-in-out infinite;
      }

      #thought-bubble.visible {
        display: flex;
      }

      #thought-bubble::before {
        content: "";
        position: absolute;
        bottom: -4px;
        left: 20%;
        width: 6px;
        height: 6px;
        background: #fff;
        border-radius: 50%;
        border: 2px solid #333;
        z-index: 1;
      }
      #thought-bubble::after {
        content: "";
        position: absolute;
        bottom: -10px;
        left: 10%;
        width: 4px;
        height: 4px;
        background: #fff;
        border-radius: 50%;
        border: 2px solid #333;
        z-index: 1;
      }

      @keyframes float-bubble {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
      }

      /* --- ANIMACIONES --- */

      /* Caminar */
      .state-walking {
        animation: walk-cycle 0.6s steps(3) infinite;
      }

      @keyframes walk-cycle {
        from {
          background-position-x: 0;
        }
        to {
          background-position-x: -144px;
        }
      }

      @keyframes eat-sprite {
        0% {
          background-position-x: 0;
        } /* Frame 0 */
        20% {
          background-position-x: -48px;
        } /* Frame 1 */
        40% {
          background-position-x: 0;
        } /* Frame 0 */
        60% {
          background-position-x: -48px;
        } /* Frame 1 */
        80% {
          background-position-x: -96px;
        } /* Frame 2 (Final) */
        100% {
          background-position-x: -96px;
        }
      }

      @keyframes eat-vibrate {
        0%,
        80% {
          transform: translate(0, 0);
        }
        82% {
          transform: translate(1px, 0);
        }
        84% {
          transform: translate(-1px, 0);
        }
        86% {
          transform: translate(0, 1px);
        }
        88% {
          transform: translate(0, -1px);
        }
        90% {
          transform: translate(1px, 1px);
        }
        92% {
          transform: translate(-1px, -1px);
        }
        94% {
          transform: translate(1px, -1px);
        }
        96% {
          transform: translate(-1px, 1px);
        }
        98% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(0, 0);
        }
      }

      @keyframes sleep-cycle {
        from {
          background-position-x: 0;
        }
        to {
          background-position-x: -96px;
        } /* 2 frames * 48px */
      }

      @keyframes love-sequence {
        0% {
          background-position-x: 0;
        } /* Frame 0 */
        20% {
          background-position-x: -64px;
        } /* Frame 1 */
        40% {
          background-position-x: -128px;
        } /* Frame 2 */
        60% {
          background-position-x: -64px;
        } /* Frame 1 */
        80% {
          background-position-x: -128px;
        } /* Frame 2 */
        100% {
          background-position-x: 0;
        } /* Reset */
      }

      /* --- DIRECCIONES (Solo para Walking/Idle) --- */
      /* Altura de frame = 48px */
      .facing-down {
        background-position-y: 0px;
      }
      .facing-left {
        background-position-y: -48px;
      }
      .facing-right {
        background-position-y: -96px;
      }
      .facing-up {
        background-position-y: -144px;
      }
    </style>
  </head>
  <body>
    <div id="paco-container">
      <div id="error-bubble">
        <span id="error-message">!</span>
        <span id="close-error">×</span>
      </div>
      <div id="thought-bubble">🧀</div>
      <div id="paco-sprite" class="sprite facing-down"></div>
    </div>

    <!-- DEBUG PANEL -->
    <div
      id="debug-panel"
      style="
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 20000; /* Ultra high z-index */
        display: none; /* Hidden by default, toggled via Tray */
        flex-direction: column;
        background: #ff0000; /* Bright red temp background to FIND IT */
        border: 2px solid white;
        padding: 8px;
        border-radius: 8px;
        cursor: pointer;
        opacity: 1 !important;
      "
    >
      <button onclick="triggerError('Info: Just saying hi')">Info</button>
      <button onclick="triggerError('Warning: Low battery?')">Warn</button>
      <button onclick="triggerError('Critical: FEED ME')">Crit</button>
      <div style="height: 5px"></div>
      <button
        onclick="
          petBrain.vitals.hunger = 10;
          petBrain.updateVitals();
        "
      >
        Starve
      </button>
      <button
        onclick="
          petBrain.vitals.energy = 10;
          petBrain.updateVitals();
        "
      >
        Sleepy
      </button>
    </div>
    <style>
      #debug-panel button {
        font-size: 10px;
        cursor: pointer;
        margin-bottom: 2px;
        background: white;
        border: none;
        padding: 2px 5px;
      }
      #debug-panel button:hover {
        background: #ddd;
      }
    </style>

    <script>
      const petBrain = require("./systems/PetBrain");
      window.petBrain = petBrain; // Expose for debug
      document.addEventListener("DOMContentLoaded", () => {
        petBrain.init();
        // Click listener removed to avoid conflict with Drag logic in PetBrain.js
        // const paco = document.getElementById("paco-container");
        // paco.addEventListener("click", () => petBrain.interact());
      });
      const { ipcRenderer } = require("electron");

      const errorBubble = document.getElementById("error-bubble");
      const errorMessage = document.getElementById("error-message");
      const closeError = document.getElementById("close-error");
      let errorTimeout;

      function showError(msg) {
        errorMessage.textContent = msg || "Error";
        errorBubble.classList.add("visible");

        // Clear previous timeout
        if (errorTimeout) clearTimeout(errorTimeout);

        // Auto hide after 2s
        errorTimeout = setTimeout(() => {
          hideError();
        }, 2000);
      }

      function hideError() {
        errorBubble.classList.remove("visible");
      }

      closeError.addEventListener("click", (e) => {
        e.stopPropagation(); // Don't trigger click/drag on paco
        hideError();
      });

      ipcRenderer.on("error-report", (e, err) => {
        console.error(err);
        showError(typeof err === "string" ? err : err.message || "Error");
      });

      // Toggle Debug Panel
      ipcRenderer.on("toggle-debug", (e, isDebug) => {
        const panel = document.getElementById("debug-panel");
        panel.style.display = isDebug ? "flex" : "none";
      });
    </script>
  </body>
</html>
